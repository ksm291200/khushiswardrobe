<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FCFAF7">
<title>Khushi's Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FCFAF7; --paper:#F6F0E9; --champagne:#F3EBE1; --blush:#FBE9EC;
  --rose:#F28CB4; --wine:#D93B80; --coral:#FF6F8E; --coralsoft:#FFE1E6; --ink:#342C27; --mute:#8B7D73; --line:#E8DCD3;
  --r:14px; --shadow:0 1px 2px rgba(52,44,39,.04),0 8px 24px -12px rgba(52,44,39,.18);
  --tab-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ivory);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-size:15px;line-height:1.5;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;letter-spacing:.01em}
h1{font-size:2rem;line-height:1.12;margin:0}
h2{font-size:1.45rem;line-height:1.2;margin:0}
h3{font-size:1.15rem;margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hide{display:none!important}

.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.view{display:none;padding-top:16px;animation:fade .2s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.topbar{position:sticky;top:0;z-index:40;background:rgba(252,250,247,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:54px}
.brand{font-family:'Cormorant Garamond',serif;font-size:1.3rem;letter-spacing:.05em}
.brand em{font-style:italic;color:var(--rose)}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--ivory);font-size:1rem;color:var(--ink);flex:none}
.iconbtn.solid{background:linear-gradient(135deg,var(--wine),var(--coral));color:#fff;border-color:transparent}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(252,250,247,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;font-weight:500}
.tabs button .g{font-size:1.15rem;line-height:1}
.tabs button.on{color:var(--wine)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr);gap:15px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(5,1fr)}}
.grid.small{grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:620px){.grid.small{grid-template-columns:repeat(5,1fr)}}
@media(min-width:900px){.grid.small{grid-template-columns:repeat(7,1fr)}}
.card{background:var(--paper);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);text-align:left;display:block;width:100%;position:relative;color:var(--ink)}
.card .ph{aspect-ratio:3/4;background:var(--champagne);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;mix-blend-mode:multiply}
.card .meta{padding:8px 10px 10px}
.card .nm{font-family:'Cormorant Garamond',serif;font-size:1rem;line-height:1.15;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.swf{position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center}
.swf span{font-family:'Cormorant Garamond',serif;font-size:.9rem;color:rgba(52,44,39,.55);line-height:1.2}
.card .flag{position:absolute;top:7px;right:7px;background:rgba(252,250,247,.92);border-radius:20px;padding:2px 8px;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--wine)}
.card.pick{outline:2.5px solid var(--coral);outline-offset:-2.5px}
.card .tick{position:absolute;top:7px;left:7px;width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:.75rem}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--ivory);border-radius:20px;padding:6px 12px;font-size:.78rem;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:.12s;line-height:1.2}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.chip{color:var(--ink)}
.chip.add{border-style:dashed;color:var(--coral)}
.chip .dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(52,44,39,.18);flex:none}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none}

.eyebrow{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--rose);font-size:1.05rem}
.rule{height:1px;background:var(--line);margin:20px 0}
.sec{margin:24px 0}
.sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sechead .more{margin-left:auto;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.btn{background:linear-gradient(135deg,var(--wine),var(--coral));color:#fff;border-radius:30px;padding:12px 20px;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center;line-height:1.2}
.btn.ghost{background:transparent;color:var(--wine);border:1px solid var(--line)}
.btn.rose{background:linear-gradient(135deg,var(--coral),var(--rose))}
.btn.rose{background:var(--coral)}
.btn.sm{padding:8px 14px;font-size:.68rem}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.tiny{font-size:.72rem;color:var(--mute)}
.field{margin-bottom:14px}
.field label{display:flex;align-items:center;gap:6px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.field label .req{color:var(--rose)}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--ivory);border-radius:10px;padding:10px 12px;-webkit-appearance:none}
.field textarea{min-height:66px;resize:vertical}
.empty{text-align:center;padding:44px 20px;color:var(--mute)}
.empty .serif{font-size:1.3rem;color:var(--ink);display:block;margin-bottom:6px}
.row{display:flex;gap:10px}
.row>*{flex:1}

.sheet{position:fixed;inset:0;z-index:75;display:none}
.sheet.on{display:block}
.sheet .veil{position:absolute;inset:0;background:rgba(52,44,39,.34);backdrop-filter:blur(2px)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:93vh;overflow-y:auto;background:var(--ivory);border-radius:22px 22px 0 0;
  padding:0 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(52,44,39,.2);overscroll-behavior:contain}
@media(min-width:740px){.sheet .panel{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(700px,92vw);max-height:88vh;border-radius:20px;padding-bottom:26px}}
.sheet .grab{position:sticky;top:0;background:var(--ivory);padding:14px 0 10px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .grab h2{flex:1;font-size:1.3rem}
.hero{aspect-ratio:3/4;max-height:44vh;background:var(--champagne);border-radius:var(--r);overflow:hidden;position:relative;margin-bottom:14px}
.hero img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.84rem;margin:12px 0}
.kv dt{font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.kv dd{margin:0}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.slot{aspect-ratio:3/4;border-radius:12px;background:var(--paper);border:1px dashed var(--line);display:grid;place-items:center;position:relative;overflow:hidden;padding:8px;text-align:center;width:100%}
.slot.has{border-style:solid;border-color:transparent;box-shadow:var(--shadow)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.slot .lab{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);position:relative}
.slot .x{position:absolute;top:5px;right:5px;background:rgba(252,250,247,.94);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;z-index:2;color:var(--wine)}
.slot .lock{position:absolute;top:5px;left:5px;background:var(--coral);color:#fff;border-radius:20px;padding:1px 7px;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;z-index:2}
.strip{display:flex;gap:4px}
.strip div{flex:1;aspect-ratio:3/4;border-radius:7px;background:var(--champagne);overflow:hidden}
.strip img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}

.note{background:var(--blush);border-radius:var(--r);padding:13px 15px;font-size:.84rem;line-height:1.45}
.note .serif{font-size:1.1rem;display:block;margin-bottom:3px}
.banner{background:var(--champagne);border-radius:10px;padding:9px 13px;font-size:.76rem;color:var(--mute);margin-bottom:12px}
.pillrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px}
.pillrow::-webkit-scrollbar{display:none}
.stat{background:var(--paper);border-radius:var(--r);padding:14px;text-align:center;min-width:104px;flex:none}
.stat b{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:400;display:block;line-height:1;color:var(--wine)}
.stat span{font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom));background:var(--wine);color:var(--ivory);padding:10px 18px;border-radius:30px;font-size:.78rem;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.drop{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;background:var(--paper);color:var(--mute);display:block;width:100%}
.drop .serif{font-size:1.2rem;color:var(--ink);display:block;margin-bottom:4px}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--coral);width:0;transition:width .2s}

/* tagger */
.tagphoto{aspect-ratio:3/4;max-height:38vh;background:var(--champagne);border-radius:var(--r);overflow:hidden;position:relative;margin-bottom:10px;cursor:crosshair}
.tagphoto img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block}
.tagphoto .hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(252,250,247,.9);border-radius:20px;padding:3px 10px;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--wine);white-space:nowrap}
.tagnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.tagnav .cnt{flex:1;text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--mute)}
.dressrow{display:flex;gap:6px}
.dressrow button{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 0;font-size:.8rem;color:var(--mute);background:var(--ivory);display:flex;flex-direction:column;align-items:center;gap:1px}
.dressrow button small{font-size:.52rem;letter-spacing:.06em;text-transform:uppercase}
.dressrow button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.lookup{position:relative}
.lookup ul{position:absolute;left:0;right:0;top:100%;background:var(--ivory);border:1px solid var(--line);border-radius:10px;list-style:none;margin:4px 0 0;padding:4px 0;max-height:180px;overflow-y:auto;z-index:5;box-shadow:var(--shadow)}
.lookup li{padding:8px 12px;font-size:.84rem;cursor:pointer}
.lookup li:hover{background:var(--paper)}
.sweepbar{position:sticky;bottom:0;background:var(--ivory);border-top:1px solid var(--line);padding:10px 0 4px;margin-top:10px}
.pin{position:fixed;inset:0;z-index:100;background:var(--ivory);display:grid;place-items:center;text-align:center;padding:20px}
.pin input{font-family:'Cormorant Garamond',serif;font-size:2rem;text-align:center;letter-spacing:.5em;border:none;border-bottom:1px solid var(--line);background:none;width:200px;padding:8px;margin:18px 0}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.check input{width:20px;height:20px;accent-color:var(--rose)}
.check.done{color:var(--mute);text-decoration:line-through}
.colorbar{display:flex;gap:6px;flex-wrap:wrap}
.colorbar div{width:28px;height:28px;border-radius:50%;border:1px solid rgba(52,44,39,.15)}
.why{font-size:.8rem;color:var(--mute);margin-top:6px;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:.95rem}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetIn{from{transform:translate(-50%,-50%) scale(.96);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes float{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),-120px) scale(1.1) rotate(var(--rot));opacity:0}}
.view.on>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view.on>*:nth-child(2){animation-delay:.05s}.view.on>*:nth-child(3){animation-delay:.1s}.view.on>*:nth-child(4){animation-delay:.15s}.view.on>*:nth-child(5){animation-delay:.2s}.view.on>*:nth-child(n+6){animation-delay:.25s}
.grid .card{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*35ms)}
.card{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.card:active{transform:scale(.97)}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(52,44,39,.05),0 16px 32px -14px rgba(52,44,39,.25)}}
.chip{transition:background .15s,color .15s,border-color .15s,transform .1s}
.chip:active{transform:scale(.95)}
.btn{transition:transform .15s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.thinking{background:linear-gradient(90deg,var(--wine) 0%,var(--coral) 50%,var(--wine) 100%);background-size:200% 100%;animation:shimmer 1.1s linear infinite;pointer-events:none}
.sheet.on .veil{animation:veilIn .25s both}
.sheet.on .panel{animation:sheetUp .42s cubic-bezier(.2,.8,.2,1) both}
@media(min-width:740px){.sheet.on .panel{animation:sheetIn .35s cubic-bezier(.2,.8,.2,1) both}}
.slot.has img{animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
.slot{transition:background .2s,border-color .2s}
.tabs button{transition:color .2s}
.tabs button .g{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tabs button.on .g{transform:translateY(-2px) scale(1.15)}
.toast{transition:opacity .25s,transform .25s;transform:translate(-50%,8px)}
.toast.on{transform:translate(-50%,0)}
.burst{position:fixed;left:50%;top:50%;z-index:90;pointer-events:none;font-size:1.6rem;color:var(--coral);animation:float 1.1s ease-out both}
#sugg>.card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
#sugg>.card:nth-child(2){animation-delay:.12s}#sugg>.card:nth-child(3){animation-delay:.24s}
.hero img,.tagphoto img{animation:veilIn .35s both}

/* moodboard editor */
.bv{position:fixed;inset:0;z-index:70;background:var(--ivory);display:none;flex-direction:column}
.bv.on{display:flex;animation:veilIn .2s both}
.bv .top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top))}
.bv .top h2{flex:1;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bv .cw{flex:1;display:grid;place-items:center;padding:12px;overflow:hidden;min-height:0}
.canvas{position:relative;aspect-ratio:3/4;width:100%;max-width:calc((100vh - 190px) * .75);max-height:100%;background:var(--paper);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(rgba(52,44,39,.09) 1px,transparent 1px);background-size:22px 22px}
.el{position:absolute;transform-origin:center;cursor:grab;will-change:transform}
.el.sel{outline:2px solid var(--coral);outline-offset:4px;border-radius:10px}
.el.item img,.el.img img{width:100%;display:block;border-radius:10px;pointer-events:none;box-shadow:0 10px 24px -12px rgba(52,44,39,.35)}
.el.item img{mix-blend-mode:multiply;box-shadow:none}
.el.item{border-radius:10px;overflow:visible}
.el.col{aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.7);box-shadow:0 6px 16px -8px rgba(52,44,39,.35)}
.el.txt{font-family:'Cormorant Garamond',serif;font-style:italic;line-height:1.2;padding:4px 8px;color:var(--ink);white-space:pre-wrap;text-align:center}
.el.txt.sm{font-size:clamp(11px,3.2cqw,18px)}.el.txt.md{font-size:clamp(14px,4.6cqw,26px)}.el.txt.lg{font-size:clamp(18px,7cqw,40px)}
.canvas{container-type:inline-size}
.el .rz{position:absolute;right:-10px;bottom:-10px;width:22px;height:22px;border-radius:50%;background:var(--coral);border:2px solid var(--ivory);cursor:nwse-resize;display:none;touch-action:none}
.el.sel .rz{display:block}
.bv .tools{display:flex;gap:6px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.bv .tools::-webkit-scrollbar{display:none}
.bv .tools .chip{flex:none}
.eltools{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(252,250,247,.96);border:1px solid var(--line);border-radius:30px;padding:4px;display:flex;gap:2px;box-shadow:var(--shadow);z-index:5;animation:pop .25s both}
.eltools button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;color:var(--wine)}
.mini{position:absolute;inset:0}
.mini .m{position:absolute;transform-origin:center}
.mini .m img{width:100%;display:block;border-radius:4px;mix-blend-mode:multiply}
.mini .m.col{aspect-ratio:1;border-radius:50%}
.mini .m.txt{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.55rem;line-height:1.1;color:var(--mute)}
.empty-canvas{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);padding:30px;pointer-events:none}
.empty-canvas .serif{display:block;font-size:1.3rem;color:var(--ink)}

@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes confetti{0%{transform:translate(-50%,0) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),var(--dy)) rotate(var(--rot));opacity:0}}
.spark{display:inline-block;color:var(--coral);animation:twinkle 2.2s ease-in-out infinite;margin-left:6px}
.spark:nth-child(2){animation-delay:.7s;font-size:.7em}
.swf{animation:pulse 1.6s ease-in-out infinite}
.card .ph img{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
@media(hover:hover){.card:hover .ph img{transform:scale(1.04)}}
.conf{position:fixed;left:50%;top:40%;width:10px;height:14px;border-radius:3px;z-index:90;pointer-events:none;animation:confetti 1.3s cubic-bezier(.2,.7,.3,1) both}

const $ = s => document.querySelector(s);

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : "";

const groupOf = cat => (S.vocab?.cats.find(c=>c.n===cat)||{}).g || "";

function confetti(){ const cols=["#D93B80","#FF6F8E","#F28CB4","#FFD166","#F3EBE1"]; for(let i=0;i<26;i++){ const s=document.createElement("span"); s.className="conf"; s.style.background=cols[i%cols.length]; s.style.setProperty("--dx",(Math.random()*360-180)+"px"); s.style.setProperty("--dy",(Math.random()*260+80)+"px"); s.style.setProperty("--rot",(Math.random()*720-360)+"deg"); s.style.animationDelay=(Math.random()*180)+"ms"; document.body.appendChild(s); setTimeout(()=>s.remove(),1700); } }
function countUp(root){ root.querySelectorAll(".stat b").forEach(b=>{ const n=+b.textContent; if(!n) return; const t0=performance.now(); const step=t=>{ const p=Math.min(1,(t-t0)/700); b.textContent=Math.round(n*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }); }
function burst(){ for(let i=0;i<7;i++){ const s=document.createElement("span"); s.className="burst"; s.textContent=["♡","✦","♡"][i%3]; s.style.setProperty("--dx",(Math.random()*160-80)+"px"); s.style.setProperty("--rot",(Math.random()*60-30)+"deg"); s.style.animationDelay=(i*60)+"ms"; document.body.appendChild(s); setTimeout(()=>s.remove(),1400); } }
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1800); }
function daysSinceWear(id){ const ws=Object.values(S.wears).filter(w=>w.itemId===id).map(w=>w.date).sort(); if(!ws.length) return null; return Math.round((Date.now()-new Date(ws[ws.length-1]))/86400000); }
function wearCount(id){ return Object.values(S.wears).filter(w=>w.itemId===id).length; }
function harmony(a,b){ if(!a||!b) return 1; if(a===b) return 1.5; if(NEUTRAL.has(a)||NEUTRAL.has(b)) return 2; if(PAIRS.includes(a+"|"+b)||PAIRS.includes(b+"|"+a)) return 3; return .5; }

/* ───────────── IMAGE CACHE (IndexedDB, best effort) ───────────── */
let idb=null;
try{ const rq=indexedDB.open("closet-img",1); rq.onupgradeneeded=e=>e.target.result.createObjectStore("t"); rq.onsuccess=e=>{idb=e.target.result;}; }catch(e){}
const idbGet = k => new Promise(r=>{ if(!idb) return r(null); try{ const t=idb.transaction("t").objectStore("t").get(k); t.onsuccess=()=>r(t.result||null); t.onerror=()=>r(null);}catch(e){r(null)} });
const idbSet = (k,v) => { if(!idb) return; try{ idb.transaction("t","readwrite").objectStore("t").put(v,k);}catch(e){} };

async function thumb(id){
  if(S.thumbs[id]) return S.thumbs[id];
  const it=S.items[id]; if(!it) return null;
  const key="t:"+id+":"+(it.tv||0);
  let v=await idbGet(key);
  if(!v){ const s=await get(R("thumbs/"+id)); v=s.val(); if(v) idbSet(key,v); }
  if(v) S.thumbs[id]=v; return v;
}
async function full(id){
  if(S.fulls[id]) return S.fulls[id];
  const it=S.items[id]; if(!it) return null;
  const key="f:"+id+":"+(it.tv||0);
  let v=await idbGet(key);
  if(!v){ const s=await get(R("images/"+id)); v=s.val(); if(v) idbSet(key,v); }
  if(v) S.fulls[id]=v; return v||await thumb(id);
}
function hydrate(root=document){
  root.querySelectorAll("img[data-t]").forEach(async img=>{ const id=img.dataset.t; delete img.dataset.t; const v=await thumb(id); if(v){ img.src=v; img.previousElementSibling?.classList.add("hide"); } });
  root.querySelectorAll("img[data-f]").forEach(async img=>{ const id=img.dataset.f; delete img.dataset.f; const v=await full(id); if(v){ img.src=v; img.previousElementSibling?.classList.add("hide"); } });
}
function imgTag(id, kind="t"){
  const it=S.items[id]||{}; 
  return `<div class="swf" style="background:${hexOf(it.colour)}33"><span>${esc(it.name||cap(it.cat)||"Untagged")}</span></div><img alt="" data-${kind}="${id}">`;
}
async function loadBitmap(file){
  try{ return await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{URL.revokeObjectURL(u);res(im)}; im.onerror=rej; im.src=u; }); }
}
function shrink(bmp,max,q){
  const w=bmp.width,h=bmp.height,s=Math.min(1,max/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
  const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}

/* ───────────── LISTEN ───────────── */
function listen(){
  onValue(R("vocab"),s=>{ const v=s.val(); if(!v){ set(R("vocab"),DEF_VOCAB); S.vocab=DEF_VOCAB; } else { S.vocab={...DEF_VOCAB,...v}; } render(); });
  onValue(R("items"),s=>{ const before=drafts().length; S.items=s.val()||{}; S.ready=true; if(S.tab==="tag"){ if(drafts().length!==before) renderTag(); } else render(); });
  onValue(R("outfits"),s=>{ S.outfits=s.val()||{}; if(S.tab==="looks"||S.tab==="home") render(); });
  onValue(R("boards"),s=>{ S.boards=s.val()||{}; if(BV.id&&!BV.drag) drawCanvas(); else if(S.tab==="studio") render(); });
  onValue(R("wears"),s=>{ S.wears=s.val()||{}; if(S.tab==="home") render(); });
  onValue(R("wishlist"),s=>{ S.wish=s.val()||{}; });
}

function ask(title, placeholder, cb, extraHtml=""){
  openSheet(`${grab(title)}<div class="field"><input type="text" id="askIn" placeholder="${esc(placeholder)}"></div>${extraHtml}<button class="btn wide" id="askOk">Save</button>`);
  const inp=$("#askIn"); setTimeout(()=>inp.focus(),50);
  const done=()=>{ const v=inp.value.trim(); if(!v) return; cb(v); closeSheet(); };
  $("#askOk").onclick=done; inp.onkeydown=e=>{ if(e.key==="Enter") done(); };
}

/* ───────────── CHIP RENDERERS ───────────── */
function chips(list,cur,attr,{multi=false,dots=false,add=null,label=null}={}){
  const sel=multi?new Set(cur||[]):null;
  return `<div class="chips" data-chips="${attr}">`+list.map(o=>{ const n=typeof o==="string"?o:o.n; const on=multi?sel.has(n):cur===n;
    return `<button class="chip ${on?"on":""}" data-v="${esc(n)}">${dots?`<i class="dot" style="background:${hexOf(n)}"></i>`:""}${esc(label?label(n):n)}</button>`; }).join("")
    +(add?`<button class="chip add" data-add="${add}">+ add</button>`:"")+`</div>`;
}

/* ───────────── HOME ───────────── */
function renderHome(){
  const h=new Date().getHours(), greet=h<12?"Good morning":h<17?"Good afternoon":"Good evening";
  const d=drafts(), all=live();
  const newIn=[...all].sort((a,b)=>(b.added||"").localeCompare(a.added||"")).slice(0,6);
  const stale=all.map(i=>({i,d:daysSinceWear(i.id)})).filter(x=>x.d===null||x.d>30).sort((a,b)=>(b.d??999)-(a.d??999)).slice(0,4);
  $("#v-home").innerHTML=`
    <div class="eyebrow">${greet}, Khushi.<span class="spark">✦</span><span class="spark">✦</span></div>
    <h1>What are we wearing?</h1>
    ${d.length?`<div class="note" style="margin-top:16px"><span class="serif">${d.length} ${d.length===1?"photo":"photos"} waiting to be tagged</span>Pick up where you left off. Everything you've set so far is saved.<div style="margin-top:10px"><button class="btn sm rose" id="goTag">Continue tagging</button></div></div>`:""}
    <div class="pillrow" style="margin-top:18px">
      <div class="stat"><b>${all.length}</b><span>pieces</span></div>
      <div class="stat"><b>${Object.keys(S.outfits).length}</b><span>looks</span></div>
      <div class="stat"><b>${Object.keys(S.boards).length}</b><span>boards</span></div>
      <div class="stat"><b>${Object.keys(S.wears).length}</b><span>wears logged</span></div>
    </div>
    <div class="sec"><div class="row" style="flex-wrap:wrap;gap:8px">
      <button class="btn" data-go="build">Build an outfit</button>
      <button class="btn ghost" data-go="studio">Open studio</button>
      <button class="btn ghost" id="homeAdd">Add pieces</button>
    </div></div>
    ${all.length?`<div class="sec"><div class="sechead"><h2>New in</h2><button class="more" data-go="closet">Closet</button></div><div class="grid">${newIn.map(card).join("")}</div></div>`:
      `<div class="empty"><span class="serif">Your closet is empty</span>Tap + and pick your photos. You can select all of them at once.</div>`}
    ${stale.length&&all.length>8?`<div class="sec"><div class="sechead"><h2>Haven't had an outing lately</h2></div><div class="grid">${stale.map(x=>card(x.i,x.d===null?"never worn":x.d+" days")).join("")}</div></div>`:""}
  `;
  $("#goTag")&&($("#goTag").onclick=()=>{S.tagIdx=0;go("tag")});
  $("#homeAdd")&&($("#homeAdd").onclick=()=>$("#fileIn").click());
  hydrate($("#v-home")); countUp($("#v-home"));
}

/* ───────────── CARD ───────────── */
let cardN=0;
function card(it,flag=""){ return `<button class="card" style="--i:${Math.min(cardN++%14,12)}" data-item="${it.id}"><div class="ph">${imgTag(it.id)}${flag?`<span class="flag">${esc(flag)}</span>`:""}</div><div class="meta"><div class="nm">${esc(it.name||cap(it.cat)||"Untitled")}</div><div class="sub">${esc(it.cat)}${it.colour?" · "+esc(it.colour):""}</div></div></button>`; }

/* ───────────── CLOSET ───────────── */
function filtered(){
  const f=S.f, q=S.q.toLowerCase();
  return Object.values(S.items).filter(i=>!i.draft && (!!i.archived===f.archived)
    && (!f.group||groupOf(i.cat)===f.group) && (!f.cat||i.cat===f.cat) && (!f.colour||i.colour===f.colour||i.colour2===f.colour)
    && (!f.vibe||(i.vibes||[]).includes(f.vibe)) && (!f.occ||(i.occ||[]).includes(f.occ)) && (!f.weather||i.weather===f.weather) && (!f.dress||String(i.dress)===f.dress)
    && (!q||[i.name,i.cat,i.colour,i.colour2,i.pattern,i.brand,i.notes,...(i.vibes||[]),...(i.occ||[])].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>(a.cat||"").localeCompare(b.cat||"")||(a.name||"").localeCompare(b.name||""));
}
function renderCloset(){
  const V=S.vocab, list=filtered();
  const catsIn=S.f.group?V.cats.filter(c=>c.g===S.f.group):[];
  $("#v-closet").innerHTML=`
    <div class="field" style="margin-bottom:10px"><input type="text" id="q" placeholder="Search your closet" value="${esc(S.q)}"></div>
    <div class="scroller">${chips(GROUPS.map(g=>({n:g})),S.f.group,"group",{label:n=>GROUP_LABEL[n]})}</div>
    ${catsIn.length?`<div class="scroller" style="margin-top:6px">${chips(catsIn,S.f.cat,"cat")}</div>`:""}
    <div class="scroller" style="margin-top:6px">${chips(V.colours,S.f.colour,"colour",{dots:true})}</div>
    <div class="scroller" style="margin-top:6px">${chips(V.vibes,S.f.vibe,"vibe")}${chips(V.occ,S.f.occ,"occ")}${chips(V.weather,S.f.weather,"weather")}${chips(DRESS.map(d=>({n:d[0]})),S.f.dress,"dress",{label:n=>DRESS[+n-1][1]})}</div>
    <div style="display:flex;align-items:center;gap:10px;margin:14px 0 10px"><span class="tiny">${list.length} ${list.length===1?"piece":"pieces"}</span><span class="spacer"></span>
      ${Object.values(S.f).some(v=>v&&v!==false)||S.q?`<button class="chip" id="clearF">Clear filters</button>`:""}
      <button class="chip ${S.f.archived?"on":""}" id="archT">Archived</button></div>
    ${list.length?`<div class="grid">${list.map(i=>card(i)).join("")}</div>`:`<div class="empty"><span class="serif">Nothing matches</span>Try fewer filters.</div>`}`;
  $("#q").oninput=e=>{S.q=e.target.value;renderClosetGridOnly();};
  $("#archT").onclick=()=>{S.f.archived=!S.f.archived;renderCloset();};
  $("#clearF")&&($("#clearF").onclick=()=>{S.q="";S.f={group:"",cat:"",colour:"",vibe:"",occ:"",weather:"",dress:"",archived:false};renderCloset();});
  $("#v-closet").querySelectorAll("[data-chips]").forEach(c=>c.onclick=e=>{ const b=e.target.closest(".chip"); if(!b) return; const k=c.dataset.chips; S.f[k]=S.f[k]===b.dataset.v?"":b.dataset.v; if(k==="group") S.f.cat=""; renderCloset(); });
  hydrate($("#v-closet"));
}
function renderClosetGridOnly(){ const g=$("#v-closet .grid, #v-closet .empty"); const list=filtered(); if(!g) return renderCloset(); g.outerHTML=list.length?`<div class="grid">${list.map(i=>card(i)).join("")}</div>`:`<div class="empty"><span class="serif">Nothing matches</span>Try fewer filters.</div>`; hydrate($("#v-closet")); }

/* ───────────── ITEM SHEET ───────────── */

  const d=daysSinceWear(id), wc=wearCount(id);
  const works=live().filter(o=>o.id!==id&&groupOf(o.cat)!==groupOf(it.cat)&&harmony(it.colour,o.colour)>=2).length;
  openSheet(`${grab(esc(it.name||cap(it.cat)||"Untitled"))}
    <div class="hero">${imgTag(id,"f")}</div>
    <div class="chips">${(it.vibes||[]).map(v=>`<span class="chip on">${esc(v)}</span>`).join("")}${(it.occ||[]).map(v=>`<span class="chip">${esc(v)}</span>`).join("")}</div>
    <dl class="kv">
      <dt>Category</dt><dd>${esc(it.cat)||"–"}</dd>
      <dt>Colour</dt><dd>${esc(it.colour)||"–"}${it.colour2?" with "+esc(it.colour2):""}</dd>
      <dt>Pattern</dt><dd>${esc(it.pattern)||"–"}</dd>
      <dt>Dressiness</dt><dd>${it.dress?DRESS[it.dress-1][1]+" ("+it.dress+")":"–"}</dd>
      <dt>Weather</dt><dd>${esc(it.weather)||"–"}</dd>
      ${it.brand?`<dt>Brand</dt><dd>${esc(it.brand)}</dd>`:""}
      <dt>Worn</dt><dd>${wc} ${wc===1?"time":"times"}${d!==null?", last "+d+" days ago":""}</dd>
      <dt>Pairs with</dt><dd>about ${works} pieces</dd>
      ${it.notes?`<dt>Notes</dt><dd>${esc(it.notes)}</dd>`:""}
    </dl>
    <div class="row" style="margin-top:14px"><button class="btn" id="wore">Wore this today</button><button class="btn rose" id="styleThis">Style this</button></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="editIt">Edit</button><button class="btn ghost" id="archIt">${it.archived?"Restore":"Archive"}</button><button class="btn ghost" id="delIt" style="color:var(--rose)">Delete</button></div>`);
  $("#wore").onclick=()=>{ push(R("wears"),{itemId:id,date:today()}); burst(); toast("Logged"); closeSheet(); };
  $("#styleThis").onclick=()=>{ closeSheet(); S.build.slots={}; S.build.lock=id; placeInSlots([id]); go("build"); suggest(); };
  $("#editIt").onclick=()=>openForm(id);
  $("#archIt").onclick=()=>{ saveItem(id,{archived:!it.archived}); toast(it.archived?"Restored":"Archived"); closeSheet(); };
  $("#delIt").onclick=()=>{ if(!confirm("Delete this piece and its photo? Saved looks keep a blank where it was.")) return; remove(R("items/"+id)); remove(R("thumbs/"+id)); remove(R("images/"+id)); closeSheet(); toast("Deleted"); };
}

/* ───────────── ADD PHOTOS ───────────── */
$("#addBtn").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
  openSheet(`${grab("Adding photos")}<div class="tiny">Resizing and saving on your device. Keep this open.</div><div class="prog"><i id="pbar"></i></div><div class="tiny" id="pmsg">0 of ${files.length}</div>`);
  let n=0; const last=S.items[Object.keys(S.items).slice(-1)[0]]||{};
  for(const f of files){
    try{
      const bmp=await loadBitmap(f); const t=shrink(bmp,380,.72), fu=shrink(bmp,1000,.78); const id=uid();
      await set(R("items/"+id),{id,name:"",cat:"",colour:"",colour2:"",pattern:"solid",dress:0,weather:"",occ:[],vibes:[],brand:"",notes:"",draft:true,added:new Date().toISOString(),tv:Date.now()});
      await set(R("thumbs/"+id),t); await set(R("images/"+id),fu); S.thumbs[id]=t; S.fulls[id]=fu;
    }catch(err){ console.error(err); }
    n++; $("#pbar").style.width=(n/files.length*100)+"%"; $("#pmsg").textContent=`${n} of ${files.length}`;
  }
  closeSheet(); toast(`${n} added`); S.tagIdx=drafts().length-n; if(S.tagIdx<0) S.tagIdx=0; go("tag");
};

function bindForm(root,id){
  const it=()=>S.items[id];
  root.querySelectorAll("[data-chips]").forEach(c=>c.onclick=e=>{
    const b=e.target.closest(".chip[data-v]"); if(!b) return; const k=c.dataset.chips, v=b.dataset.v;
    if(k==="occ"||k==="vibes"){ const cur=new Set(it()[k]||[]); cur.has(v)?cur.delete(v):cur.add(v); saveItem(id,{[k]:[...cur]}); b.classList.toggle("on"); }
    else { const nv=it()[k]===v?"":v; saveItem(id,{[k]:nv}); c.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.v===nv)); }
  });
  root.querySelector("[data-dress]").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; saveItem(id,{dress:+b.dataset.v}); root.querySelectorAll("[data-dress] button").forEach(x=>x.classList.toggle("on",x===b)); };
  const deb=(el,k)=>{ let t; el.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>saveItem(id,{[k]:el.value.trim()}),400); }; };
  deb(root.querySelector("#fName"),"name"); deb(root.querySelector("#fBrand"),"brand"); deb(root.querySelector("#fNotes"),"notes");
  root.querySelector("#nameSug").onclick=()=>{ const i=it(); const n=[cap(i.colour),i.pattern&&i.pattern!=="solid"?i.pattern:"",i.cat].filter(Boolean).join(" "); root.querySelector("#fName").value=n; saveItem(id,{name:n}); };
  root.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addVocab(b.dataset.add,id));
  const lk=root.querySelector("#lk"), ul=root.querySelector("#lkList");
  lk.oninput=()=>{ const q=lk.value.trim().toLowerCase(); if(q.length<2){ul.classList.add("hide");return;} const hits=SEED.filter(s=>s.name.toLowerCase().includes(q)).slice(0,8); ul.innerHTML=hits.map((s,i)=>`<li data-i="${SEED.indexOf(s)}">${esc(s.name)} <span class="tiny">${esc(s.category)}</span></li>`).join("")||`<li class="tiny">No match</li>`; ul.classList.remove("hide"); };
  ul.onclick=e=>{ const li=e.target.closest("li[data-i]"); if(!li) return; const s=SEED[+li.dataset.i]; const cat=S.vocab.cats.find(c=>c.n===s.category)?s.category:"";
    saveItem(id,{name:s.name,cat,colour:s.colour,colour2:s.colour2||"",pattern:s.pattern||"solid",dress:s.dress||0,weather:s.weather||"",occ:s.occ||[],vibes:s.vibes||[]}).then(()=>{ toast("Filled from your list"); if(S.tab==="tag") renderTag(); else openForm(id); }); };
}

  bindForm($("#panel"),id); bindSampler($("#tp"),id);

/* ───────────── COLOUR SAMPLER ───────────── */
function bindSampler(el,id){
  el.onclick=async e=>{
    const img=el.querySelector("img"); if(!img||!img.src) return;
    const r=el.getBoundingClientRect(), nw=img.naturalWidth, nh=img.naturalHeight; if(!nw) return;
    const sc=Math.min(r.width/nw,r.height/nh), dw=nw*sc, dh=nh*sc, ox=(r.width-dw)/2, oy=(r.height-dh)/2;
    const x=(e.clientX-r.left-ox)/sc, y=(e.clientY-r.top-oy)/sc; if(x<0||y<0||x>nw||y>nh) return;
    const c=document.createElement("canvas"); c.width=nw; c.height=nh; const cx=c.getContext("2d"); cx.drawImage(img,0,0);
    const d=cx.getImageData(Math.max(0,x-3),Math.max(0,y-3),7,7).data; let R0=0,G0=0,B0=0,n=0; for(let i=0;i<d.length;i+=4){R0+=d[i];G0+=d[i+1];B0+=d[i+2];n++;} R0/=n;G0/=n;B0/=n;
    let best=null,bd=1e9; for(const col of S.vocab.colours){ if(col.n==="multicolour") continue; const h=col.h.replace("#",""); const cr=parseInt(h.slice(0,2),16),cg=parseInt(h.slice(2,4),16),cb=parseInt(h.slice(4,6),16);
      const dist=(cr-R0)**2*.3+(cg-G0)**2*.59+(cb-B0)**2*.11; if(dist<bd){bd=dist;best=col.n;} }
    if(!best) return; saveItem(id,{colour:best}); toast("Colour: "+best);
    const chipsEl=document.querySelector('[data-chips="colour"]'); chipsEl&&chipsEl.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.v===best));
  };
}

/* ───────────── TAGGER ───────────── */
function renderTag(){
  const q=drafts(); const V=S.vocab;
  if(!q.length){ if(S.tagWasBusy) confetti(); S.tagWasBusy=false; $("#v-tag").innerHTML=`<div class="empty"><span class="serif">Everything's tagged</span>Add more photos with + whenever you buy something.<div style="margin-top:14px"><button class="btn" data-go="closet">See the closet</button></div></div>`; return; }
  S.tagWasBusy=true; if(S.tagIdx>=q.length) S.tagIdx=q.length-1; if(S.tagIdx<0) S.tagIdx=0;
  if(S.sweep){
    const n=S.sel.size;
    $("#v-tag").innerHTML=`
      <div class="tagnav"><button class="chip" id="modeT">One at a time</button><span class="cnt">${q.length} untagged</span><button class="chip" id="selAll">${n===q.length?"Clear":"Select all"}</button></div>
      <div class="tiny" style="margin-bottom:8px">Tap to select several, then apply one thing to all of them.</div>
      <div class="grid small" data-nopick>${q.map(i=>`<button class="card ${S.sel.has(i.id)?"pick":""}" data-sel="${i.id}"><div class="ph">${imgTag(i.id)}${S.sel.has(i.id)?`<span class="tick">✓</span>`:""}</div><div class="meta"><div class="sub">${esc(i.cat)||"—"}${i.colour?" · "+esc(i.colour):""}${i.dress?" · "+i.dress:""}</div></div></button>`).join("")}</div>
      <div class="sweepbar"><div class="tiny" style="margin-bottom:6px">${n?`Apply to ${n} selected`:"Select some photos first"}</div>
        <div class="chips">${["cat","colour","dress","weather","pattern","occ","vibes"].map(k=>`<button class="chip" data-sw="${k}" ${n?"":"disabled"}>${{cat:"Category",colour:"Colour",dress:"Dressiness",weather:"Weather",pattern:"Pattern",occ:"Occasion",vibes:"Vibe"}[k]}</button>`).join("")}
        <button class="chip on" id="swDone" ${n?"":"disabled"}>Mark done</button></div></div>`;
    $("#modeT").onclick=()=>{S.sweep=false;renderTag();};
    $("#selAll").onclick=()=>{ if(S.sel.size===q.length) S.sel.clear(); else q.forEach(i=>S.sel.add(i.id)); renderTag(); };
    $$("#v-tag [data-sel]").forEach(b=>b.onclick=()=>{ const id=b.dataset.sel; S.sel.has(id)?S.sel.delete(id):S.sel.add(id); renderTag(); });
    $$("#v-tag [data-sw]").forEach(b=>b.onclick=()=>sweepPick(b.dataset.sw));
    $("#swDone").onclick=()=>{ let ok=0,bad=0; S.sel.forEach(id=>{ const i=S.items[id]; if(i.cat&&i.colour&&i.dress){ saveItem(id,{draft:false}); ok++; } else bad++; }); S.sel.clear(); toast(ok+" done"+(bad?", "+bad+" still need category, colour or dressiness":"")); };
    hydrate($("#v-tag")); return;
  }
  const it=q[S.tagIdx];
  $("#v-tag").innerHTML=`
    <div class="tagnav"><button class="chip" id="prevT" ${S.tagIdx?"":"disabled"}>‹</button><span class="cnt">${S.tagIdx+1} of ${q.length}</span><button class="chip" id="modeT">Sweep mode</button><button class="chip" id="nextT" ${S.tagIdx<q.length-1?"":"disabled"}>›</button></div>
    <div class="tagphoto" id="tp">${imgTag(it.id,"f")}<span class="hint">Tap the garment to sample its colour</span></div>
    ${formHtml(it)}
    <div class="row" style="margin-top:6px"><button class="btn ghost" id="skipT">Skip for now</button><button class="btn" id="doneT">Done, next</button></div>
    <div style="margin-top:10px;text-align:center"><button class="chip" id="delT" style="color:var(--rose)">Remove this photo</button></div>`;
  bindForm($("#v-tag"),it.id); bindSampler($("#tp"),it.id); hydrate($("#v-tag"));
  $("#prevT").onclick=()=>{S.tagIdx--;renderTag();}; $("#nextT").onclick=()=>{S.tagIdx++;renderTag();};
  $("#skipT").onclick=()=>{ S.tagIdx=(S.tagIdx+1)%q.length; renderTag(); };
  $("#modeT").onclick=()=>{S.sweep=true;S.sel.clear();renderTag();};
  $("#doneT").onclick=()=>{ const i=S.items[it.id]; if(!i.cat||!i.colour||!i.dress){ toast("Needs category, colour and dressiness"); return; } saveItem(it.id,{draft:false}).then(()=>{ toast("Saved"); renderTag(); }); };
  $("#delT").onclick=()=>{ if(!confirm("Remove this photo?")) return; remove(R("items/"+it.id)); remove(R("thumbs/"+it.id)); remove(R("images/"+it.id)); };
}
function sweepPick(k){
  const V=S.vocab; const ids=[...S.sel];
  const lists={cat:V.cats,colour:V.colours,dress:DRESS.map(d=>({n:d[0]})),weather:V.weather,pattern:V.patterns,occ:V.occ,vibes:V.vibes}[k];
  const label={dress:n=>DRESS[+n-1][1]+" ("+n+")"}[k];
  openSheet(`${grab("Apply to "+ids.length)}<div class="tiny" style="margin-bottom:10px">${k==="occ"||k==="vibes"?"Adds this to each selected piece.":"Sets this on each selected piece."}</div>${chips(lists,"",k,{dots:k==="colour",label})}`);
  $("#panel [data-chips]").onclick=e=>{ const b=e.target.closest(".chip[data-v]"); if(!b) return; const v=b.dataset.v;
    ids.forEach(id=>{ const i=S.items[id]; if(k==="occ"||k==="vibes"){ const s=new Set(i[k]||[]); s.add(v); saveItem(id,{[k]:[...s]}); } else if(k==="dress") saveItem(id,{dress:+v}); else saveItem(id,{[k]:v}); });
    closeSheet(); toast("Applied to "+ids.length); };
}

/* ───────────── BUILD ───────────── */
const SLOTS=[["onepiece","One-piece"],["top","Top"],["bottom","Bottom"],["outer","Layer"],["shoes","Shoes"],["bag","Bag"],["jewellery","Jewellery"],["jewellery2","Jewellery"],["accessory","Extra"]];
function placeInSlots(ids){ ids.forEach(id=>{ const g=groupOf(S.items[id]?.cat); if(!g) return; let k=g; if(g==="jewellery"&&S.build.slots.jewellery&&S.build.slots.jewellery!==id) k="jewellery2"; S.build.slots[k]=id; }); }
function renderBuild(){
  const B=S.build, V=S.vocab;

function picker(slotKey,onPick){
  const g=slotKey.replace(/\d$/,""); let q="";
  const draw=()=>{ const list=live().filter(i=>groupOf(i.cat)===g&&(!q||(i.name+" "+i.colour+" "+i.cat).toLowerCase().includes(q))); 
    $("#pkGrid").innerHTML=list.length?list.map(i=>card(i)).join(""):`<div class="empty">Nothing in ${GROUP_LABEL[g]||g} yet</div>`; hydrate($("#pkGrid")); };
  openSheet(`${grab("Choose "+(GROUP_LABEL[g]||g).toLowerCase())}<div class="field"><input type="text" id="pkQ" placeholder="Search"></div><div class="grid" id="pkGrid" data-nopick></div>`);
  $("#pkQ").oninput=e=>{q=e.target.value.toLowerCase();draw();}; draw();
  $("#pkGrid").onclick=e=>{ const c=e.target.closest("[data-item]"); if(!c) return; closeSheet(); if(onPick) onPick(c.dataset.item); else { S.build.slots[slotKey]=c.dataset.item; renderBuild(); } };
}
function targetDress(){ const B=S.build; if(B.brief.dress) return +B.brief.dress; if(B.lock&&S.items[B.lock]?.dress) return S.items[B.lock].dress; return {work:3,brunch:3,dinner:4,date:4,party:4,wedding:5,pooja:4,festival:4,mehndi:4,holiday:2,travel:2,everyday:2}[B.brief.occ]||3; }
function score(it,ctx){
  const b=S.build.brief; let s=0;
  s-=Math.abs((it.dress||3)-ctx.target)*1.6;
  if(b.weather&&it.weather&&it.weather!==b.weather) s-=1.5;
  if(b.occ&&(it.occ||[]).length&&!(it.occ||[]).includes(b.occ)) s-=1.2; else if(b.occ&&(it.occ||[]).includes(b.occ)) s+=.8;
  if(b.vibe&&(it.vibes||[]).includes(b.vibe)) s+=1;
  ctx.chosen.forEach(o=>{ s+=harmony(it.colour,o.colour)*.9; if(it.colour2) s+=harmony(it.colour2,o.colour)*.3; });
  const d=daysSinceWear(it.id); s+= d===null?.6:Math.min(d,60)/60*.8;
  s+=Math.random()*ctx.jitter; if(ctx.used.has(it.id)) s-=2.5;
  return s;
}
function suggest(){
  const B=S.build, pool=live(); if(pool.length<3){ toast("Add a few more pieces first"); return; }
  const target=targetDress(); const used=new Set(); const looks=[];
  const lockItem=B.lock?S.items[B.lock]:null; const lockG=lockItem?groupOf(lockItem.cat):null;
  const pick=(g,ctx,exclude=[])=>{ const c=pool.filter(i=>groupOf(i.cat)===g&&!exclude.includes(i.id)&&!(lockItem&&i.id===lockItem.id)).map(i=>({i,s:score(i,ctx)})).sort((a,b)=>b.s-a.s); return c[0]?.i||null; };
  for(let n=0;n<3;n++){
    const ctx={target,chosen:[],used,jitter:1.2+n*.4}; const chosen=[]; const why=[];
    if(lockItem){ chosen.push(lockItem); ctx.chosen.push(lockItem); }
    const wantOne = lockG==="onepiece" ? true : lockG==="top"||lockG==="bottom" ? false : (n%2===0 ? pool.some(i=>groupOf(i.cat)==="onepiece") : false);
    if(wantOne&&lockG!=="onepiece"){ const d=pick("onepiece",ctx); if(d){chosen.push(d);ctx.chosen.push(d);} }
    if(!chosen.some(i=>groupOf(i.cat)==="onepiece")){ if(lockG!=="top"){ const t=pick("top",ctx); if(t){chosen.push(t);ctx.chosen.push(t);} } if(lockG!=="bottom"){ const bo=pick("bottom",ctx); if(bo){chosen.push(bo);ctx.chosen.push(bo);} } }
    if(lockG!=="shoes"){ const sh=pick("shoes",ctx); if(sh){chosen.push(sh);ctx.chosen.push(sh);} }
    if(lockG!=="bag"){ const ba=pick("bag",ctx); if(ba){chosen.push(ba);ctx.chosen.push(ba);} }
    if(lockG!=="jewellery"){ const j=pick("jewellery",ctx); if(j){chosen.push(j);ctx.chosen.push(j); const j2=pick("jewellery",ctx,[j.id]); if(j2&&j2.cat!==j.cat){chosen.push(j2);ctx.chosen.push(j2);} } }
    if(target>=4&&B.brief.weather==="cool"){ const o=pick("outer",ctx); if(o){chosen.push(o);ctx.chosen.push(o);} }
    chosen.forEach(i=>used.add(i.id));
    const cols=[...new Set(chosen.map(i=>i.colour).filter(Boolean))];
    why.push(`Dressiness pitched at ${DRESS[target-1][1]}.`);
    if(cols.length>1) why.push(`${cols.slice(0,3).map(cap).join(", ")} sit well together.`);
    const st=chosen.map(i=>({i,d:daysSinceWear(i.id)})).filter(x=>x.d===null||x.d>30)[0]; if(st) why.push(`Your ${st.i.name||st.i.cat} ${st.d===null?"hasn't been worn yet":"hasn't been out in "+st.d+" days"}.`);
    looks.push({items:chosen.map(i=>i.id),why:why.join(" ")});
  }
  B.sugg=looks; renderBuild(); setTimeout(()=>$("#sugg")?.scrollIntoView?.({behavior:"smooth",block:"start"}),50);
}

function elAction(a){

  if(a==="del"){ const patch={["els/"+BV.sel]:null}; if(e.t==="item"&&!ELS(b).some(x=>x.id!==BV.sel&&x.t==="item"&&x.ref===e.ref)) patch.items=(b.items||[]).filter(i=>i!==e.ref); BV.sel=null; update(R("boards/"+bid),patch); }

  $("#bdRename").onclick=()=>ask("Rename","",v=>{update(R(P),{name:v});openPacking(id);});
  $("#bdAdd").onclick=()=>multiPick(sel=>{ update(R(P),{items:[...new Set([...items,...sel])]}).then(()=>openPacking(id)); });
  $$("#panel [data-bi]").forEach(c=>c.onclick=()=>{ const iid=c.dataset.bi; update(R(P+"/packed"),{[iid]:!packed[iid]}).then(()=>openPacking(id)); });
  $("#exAdd").onclick=()=>{ const t=$("#exIn").value.trim(); if(!t) return; update(R(P),{extras:[...(b.extras||[]),{t,done:false}]}).then(()=>openPacking(id)); }; $("#exIn").onkeydown=e=>{if(e.key==="Enter")$("#exAdd").click();};
  $$("#panel [data-ex]").forEach(cb=>cb.onchange=()=>{ const ex=[...(b.extras||[])]; ex[+cb.dataset.ex].done=cb.checked; update(R(P),{extras:ex}).then(()=>openPacking(id)); });
  $$("#panel [data-exdel]").forEach(x=>x.onclick=e=>{ e.preventDefault(); const ex=[...(b.extras||[])]; ex.splice(+x.dataset.exdel,1); update(R(P),{extras:ex}).then(()=>openPacking(id)); });
  let t; $("#bdNotes").oninput=e=>{clearTimeout(t);t=setTimeout(()=>update(R(P),{notes:e.target.value}),400);};
  $("#bdDel").onclick=()=>{ if(confirm("Delete this list?")){ remove(R(P)); closeSheet(); } };
}
function multiPick(cb){
  const sel=new Set(); let q="", g="";
  const draw=()=>{ const list=live().filter(i=>(!g||groupOf(i.cat)===g)&&(!q||(i.name+" "+i.colour+" "+i.cat).toLowerCase().includes(q)));
    $("#mpGrid").innerHTML=list.map(i=>`<button class="card ${sel.has(i.id)?"pick":""}" data-mp="${i.id}"><div class="ph">${imgTag(i.id)}${sel.has(i.id)?`<span class="tick">✓</span>`:""}</div><div class="meta"><div class="nm">${esc(i.name||i.cat)}</div></div></button>`).join(""); hydrate($("#mpGrid")); $("#mpOk").textContent=sel.size?`Add ${sel.size}`:"Add"; };
  openSheet(`${grab("Add pieces")}<div class="field"><input type="text" id="mpQ" placeholder="Search"></div><div class="scroller" style="margin-bottom:10px">${chips(GROUPS.map(x=>({n:x})),"","g",{label:n=>GROUP_LABEL[n]})}</div><div class="grid small" id="mpGrid" data-nopick></div><div class="sweepbar"><button class="btn wide" id="mpOk">Add</button></div>`);
  $("#mpQ").oninput=e=>{q=e.target.value.toLowerCase();draw();};
  $("#panel [data-chips]").onclick=e=>{ const c=e.target.closest(".chip"); if(!c) return; g=g===c.dataset.v?"":c.dataset.v; $$("#panel [data-chips] .chip").forEach(x=>x.classList.toggle("on",x.dataset.v===g)); draw(); };
  $("#mpGrid").onclick=e=>{ const c=e.target.closest("[data-mp]"); if(!c) return; const id=c.dataset.mp; sel.has(id)?sel.delete(id):sel.add(id); draw(); };
  $("#mpOk").onclick=()=>{ closeSheet(); cb([...sel]); }; draw();
}

/* ───────────── LOOKS ───────────── */
let lookCol="";
function renderLooks(){
  const all=Object.entries(S.outfits).map(([id,o])=>({id,...o})).sort((a,b)=>(b.created||"").localeCompare(a.created||""));
  const cols=[...new Set(all.map(o=>o.collection).filter(Boolean))];
  const list=lookCol?all.filter(o=>o.collection===lookCol):all;
  $("#v-looks").innerHTML=`<div class="eyebrow">My looks</div><h2>Outfits you've saved</h2>
    ${cols.length?`<div class="scroller" style="margin:12px 0">${chips(cols,lookCol,"col")}</div>`:""}
    ${list.length?`<div class="grid">${list.map(o=>`<button class="card" data-look="${o.id}"><div class="ph" style="aspect-ratio:1/1;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px">${(o.items||[]).slice(0,4).map(id=>`<div style="border-radius:8px;overflow:hidden;background:var(--champagne);position:relative">${imgTag(id)}</div>`).join("")}</div><div class="meta"><div class="nm">${esc(o.name)}</div><div class="sub">${esc(o.collection||"")}${o.collection?" · ":""}${(o.items||[]).length} pieces</div></div></button>`).join("")}</div>`:
      `<div class="empty" style="margin-top:20px"><span class="serif">No looks yet</span>Build one, or ask Style me for ideas, then save what you love.<div style="margin-top:14px"><button class="btn" data-go="build">Build a look</button></div></div>`}`;
  $("#v-looks [data-chips]")&&($("#v-looks [data-chips]").onclick=e=>{ const c=e.target.closest(".chip"); if(!c) return; lookCol=lookCol===c.dataset.v?"":c.dataset.v; renderLooks(); });
  $$("#v-looks [data-look]").forEach(b=>b.onclick=()=>openLook(b.dataset.look));
  hydrate($("#v-looks"));
}
function openLook(id){
  const o=S.outfits[id]; if(!o) return; const items=(o.items||[]).filter(i=>S.items[i]);
  openSheet(`${grab(esc(o.name))}<div class="strip" style="margin-bottom:12px">${items.map(i=>`<div>${imgTag(i)}</div>`).join("")}</div>
    <div class="grid small" data-nopick>${items.map(i=>`<button class="card" data-li="${i}"><div class="ph">${imgTag(i)}</div><div class="meta"><div class="nm" style="font-size:.85rem">${esc(S.items[i].name||S.items[i].cat)}</div></div></button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="woreLook">Wore this today</button><button class="btn ghost" id="openLook">Open in Build</button></div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="renLook">Rename</button><button class="btn ghost" id="colLook">Collection</button><button class="btn ghost" id="delLook" style="color:var(--rose)">Delete</button></div>`);
  $("#woreLook").onclick=()=>{ items.forEach(i=>push(R("wears"),{itemId:i,date:today(),outfitId:id})); burst(); toast("Logged for "+items.length+" pieces"); closeSheet(); };
  $("#openLook").onclick=()=>{ closeSheet(); S.build.slots={}; S.build.lock=null; S.build.sugg=[]; placeInSlots(items); go("build"); };
  $("#renLook").onclick=()=>ask("Rename look","",v=>update(R("outfits/"+id),{name:v}));
  $("#colLook").onclick=()=>ask("Collection","Dinner, Work, Holiday",v=>update(R("outfits/"+id),{collection:v}));
  $("#delLook").onclick=()=>{ if(confirm("Delete this look?")){ remove(R("outfits/"+id)); closeSheet(); } };
  $$("#panel [data-li]").forEach(b=>b.onclick=()=>openItem(b.dataset.li));
}

/* ───────────── MORE: lists, insights, wishlist, export ───────────── */
$("#moreBtn").onclick=()=>{
  openSheet(`${grab("More")}
    <div class="grid small" style="grid-template-columns:1fr 1fr;gap:10px">
      <button class="card" style="padding:16px" id="mIns"><div class="serif" style="font-size:1.15rem">Insights</div><div class="tiny">Most and least worn</div></button>
      <button class="card" style="padding:16px" id="mWish"><div class="serif" style="font-size:1.15rem">Wishlist</div><div class="tiny">Should I buy it?</div></button>
      <button class="card" style="padding:16px" id="mLists"><div class="serif" style="font-size:1.15rem">Your lists</div><div class="tiny">Categories, colours, vibes</div></button>
      <button class="card" style="padding:16px" id="mExp"><div class="serif" style="font-size:1.15rem">Export</div><div class="tiny">A file you own</div></button>
    </div>
    <div class="tiny" style="margin-top:16px">${VERSION} · Untagged photos: ${drafts().length}. Archived pieces: ${Object.values(S.items).filter(i=>i.archived).length}.</div>`);
  $("#mIns").onclick=insights; $("#mWish").onclick=wishlist; $("#mLists").onclick=lists; $("#mExp").onclick=exportAll;
};
function insights(){
  const all=live(); const w=all.map(i=>({i,n:wearCount(i.id),d:daysSinceWear(i.id)}));
  const most=[...w].filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,6), never=w.filter(x=>x.n===0).slice(0,6);
  const vers=all.map(i=>({i,n:all.filter(o=>o.id!==i.id&&groupOf(o.cat)!==groupOf(i.cat)&&harmony(i.colour,o.colour)>=2).length})).sort((a,b)=>b.n-a.n).slice(0,6);
  const byCat={}; all.forEach(i=>{byCat[i.cat]=(byCat[i.cat]||0)+1;}); const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  openSheet(`${grab("Insights")}
    <div class="pillrow" style="margin-bottom:16px">${cats.slice(0,8).map(([c,n])=>`<div class="stat"><b>${n}</b><span>${esc(c)}</span></div>`).join("")}</div>
    ${most.length?`<div class="sec"><div class="sechead"><h3>Most worn</h3></div><div class="grid small" data-nopick>${most.map(x=>`<button class="card" data-item="${x.i.id}"><div class="ph">${imgTag(x.i.id)}<span class="flag">${x.n}×</span></div></button>`).join("")}</div></div>`:`<div class="tiny" style="margin-bottom:14px">Log wears from any piece or look, and this fills in over time.</div>`}
    ${never.length?`<div class="sec"><div class="sechead"><h3>Never logged</h3></div><div class="grid small" data-nopick>${never.map(x=>`<button class="card" data-item="${x.i.id}"><div class="ph">${imgTag(x.i.id)}</div></button>`).join("")}</div></div>`:""}
    ${vers.length?`<div class="sec"><div class="sechead"><h3>Most versatile</h3></div><div class="tiny" style="margin-bottom:8px">By how many other pieces the colour sits well with.</div><div class="grid small" data-nopick>${vers.map(x=>`<button class="card" data-item="${x.i.id}"><div class="ph">${imgTag(x.i.id)}<span class="flag">${x.n}</span></div></button>`).join("")}</div></div>`:""}`);
}
function wishlist(){
  const W=Object.entries(S.wish).map(([id,w])=>({id,...w}));
  const works=w=>live().filter(o=>groupOf(o.cat)!==w.group&&harmony(w.colour,o.colour)>=2).length;
  openSheet(`${grab("Wishlist")}
    ${W.map(w=>`<div class="card" style="padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center"><i class="dot" style="width:34px;height:34px;flex:none;background:${hexOf(w.colour)};border-radius:50%;border:1px solid rgba(0,0,0,.1)"></i><div style="flex:1"><div class="serif" style="font-size:1.05rem">${esc(w.name)}</div><div class="tiny">${esc(w.colour)} ${esc(GROUP_LABEL[w.group]||"")} · would pair with about ${works(w)} pieces you own</div></div><button class="chip" data-wdel="${w.id}">✕</button></div>`).join("")||`<div class="tiny" style="margin-bottom:12px">Add something you're eyeing and see how much of your closet it would work with.</div>`}
    <div class="rule"></div>
    <div class="field"><label>What is it?</label><input type="text" id="wName" placeholder="Brown leather shoulder bag"></div>
    <div class="field"><label>Colour</label>${chips(S.vocab.colours,"","wc",{dots:true})}</div>
    <div class="field"><label>Type</label>${chips(GROUPS.map(g=>({n:g})),"","wg",{label:n=>GROUP_LABEL[n]})}</div>
    <button class="btn wide" id="wAdd">Add to wishlist</button>`);
  let wc="",wg="";
  $$("#panel [data-chips]").forEach(c=>c.onclick=e=>{ const b=e.target.closest(".chip"); if(!b) return; if(c.dataset.chips==="wc") wc=b.dataset.v; else wg=b.dataset.v; c.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b)); });
  $("#wAdd").onclick=()=>{ const n=$("#wName").value.trim(); if(!n||!wc||!wg){toast("Name, colour and type");return;} push(R("wishlist"),{name:n,colour:wc,group:wg,created:today()}).then(wishlist); };
  $$("#panel [data-wdel]").forEach(b=>b.onclick=()=>remove(R("wishlist/"+b.dataset.wdel)).then(wishlist));
}
function lists(){
  const V=S.vocab;
  const sec=(t,k,arr,fmt=x=>x)=>`<div class="field"><label>${t}</label><div class="chips">${arr.map((x,i)=>`<button class="chip" data-vk="${k}" data-vi="${i}">${esc(fmt(x))} ✕</button>`).join("")}<button class="chip add" data-add="${k==="cats"?"cat":k}">+ add</button></div></div>`;
  openSheet(`${grab("Your lists")}<div class="tiny" style="margin-bottom:12px">Tap one to remove it. Pieces already tagged with it keep the tag.</div>
    ${sec("Categories","cats",V.cats,c=>c.n+" · "+GROUP_LABEL[c.g])}${sec("Colours","colours",V.colours,c=>c.n)}${sec("Patterns","patterns",V.patterns)}${sec("Occasions","occ",V.occ)}${sec("Vibes","vibes",V.vibes)}`);
  $$("#panel [data-vk]").forEach(b=>b.onclick=()=>{ const k=b.dataset.vk; const arr=[...V[k]]; const x=arr[+b.dataset.vi]; if(!confirm("Remove "+(x.n||x)+"?")) return; arr.splice(+b.dataset.vi,1); update(R("vocab"),{[k]:arr}).then(lists); });
  $$("#panel [data-add]").forEach(b=>b.onclick=()=>addVocab(b.dataset.add,null));
}
function exportAll(){
  const items=Object.values(S.items).filter(i=>!i.draft);
  const cols=["id","name","cat","colour","colour2","pattern","dress","weather","occ","vibes","brand","notes","archived","added"];
  const csv=[cols.join(",")].concat(items.map(i=>cols.map(c=>{ let v=i[c]; if(Array.isArray(v)) v=v.join(";"); v=String(v??""); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(","))).join("\n");
  const json=JSON.stringify({exported:new Date().toISOString(),items:S.items,outfits:S.outfits,boards:S.boards,wears:S.wears,wishlist:S.wish,vocab:S.vocab},null,1);
  const dl=(name,txt,type)=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type})); a.download=name; a.click(); };
  openSheet(`${grab("Export")}<div class="tiny" style="margin-bottom:14px">Two files. The spreadsheet is your wardrobe in a form anything can read. The full backup has every look, board, wear and setting, and can rebuild the app from scratch. Photos stay in Firebase and in your camera roll.</div>
    <div class="row"><button class="btn" id="exCsv">Spreadsheet (CSV)</button><button class="btn ghost" id="exJson">Full backup (JSON)</button></div>`);
  $("#exCsv").onclick=()=>dl("khushis-closet-"+today()+".csv",csv,"text/csv");
  $("#exJson").onclick=()=>dl("khushis-closet-backup-"+today()+".json",json,"application/json");
}

/* ───────────── PIN + INIT ───────────── */
function init(){
  if(PIN){ $("#pin").classList.remove("hide"); const inp=$("#pinIn"); setTimeout(()=>inp.focus(),100);
    inp.oninput=()=>{ if(inp.value.length>=PIN.length){ if(inp.value===PIN){ $("#pin").classList.add("hide"); listen(); } else { inp.value=""; $("#pinMsg").textContent="Not quite."; } } }; }
  else listen();
}
init();
</script>
</body>
</html>
